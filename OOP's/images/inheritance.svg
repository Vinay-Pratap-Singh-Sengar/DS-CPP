<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="24" fill="#f8fafc"/><text x="550.0" y="58" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#172554">Inheritance Example</text><rect x="350" y="105" width="400" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="550.0" y="147" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Animal (Base Class)</text><text x="550.0" y="181" font-family="Arial" font-size="17" text-anchor="middle" fill="#1e3a8a">eat()</text><rect x="120" y="315" width="330" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="285.0" y="357" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#14532d">Dog (Derived Class)</text><text x="285.0" y="391" font-family="Arial" font-size="17" text-anchor="middle" fill="#14532d">bark()</text><rect x="650" y="315" width="330" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="815.0" y="357" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#78350f">Cat (Derived Class)</text><text x="815.0" y="391" font-family="Arial" font-size="17" text-anchor="middle" fill="#78350f">meow()</text><text x="550.0" y="496" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">Dog and Cat inherit the eat() behaviour from Animal</text></svg>