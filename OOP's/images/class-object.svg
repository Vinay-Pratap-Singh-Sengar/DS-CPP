<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="24" fill="#f8fafc"/><text x="550.0" y="58" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#172554">Class and Objects: Student Example</text><rect x="350" y="105" width="400" height="125" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="550.0" y="147" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Class: Student</text><text x="550.0" y="181" font-family="Arial" font-size="17" text-anchor="middle" fill="#1e3a8a">name, age, rollNo; study(), display()</text><rect x="45" y="315" width="290" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="190.0" y="357" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#14532d">Object s1</text><text x="190.0" y="391" font-family="Arial" font-size="17" text-anchor="middle" fill="#14532d">Rahul, age 20</text><rect x="405" y="315" width="290" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="550.0" y="357" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#78350f">Object s2</text><text x="550.0" y="391" font-family="Arial" font-size="17" text-anchor="middle" fill="#78350f">Amit, age 21</text><rect x="765" y="315" width="290" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="910.0" y="357" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#831843">Object s3</text><text x="910.0" y="391" font-family="Arial" font-size="17" text-anchor="middle" fill="#831843">Priya, age 19</text><text x="550.0" y="496" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">One class can be used to create many individual objects</text></svg>