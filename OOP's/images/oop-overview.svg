<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="24" fill="#f8fafc"/><text x="550.0" y="58" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#172554">Object-Oriented Programming</text><rect x="70" y="180" width="220" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="180.0" y="222" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#14532d">Encapsulation</text><text x="180.0" y="256" font-family="Arial" font-size="17" text-anchor="middle" fill="#14532d">Bundle data + methods</text><rect x="330" y="180" width="220" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="440.0" y="222" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#78350f">Abstraction</text><text x="440.0" y="256" font-family="Arial" font-size="17" text-anchor="middle" fill="#78350f">Hide complexity</text><rect x="590" y="180" width="220" height="150" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="700.0" y="222" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#581c87">Inheritance</text><text x="700.0" y="256" font-family="Arial" font-size="17" text-anchor="middle" fill="#581c87">Reuse existing code</text><rect x="850" y="180" width="220" height="150" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="960.0" y="222" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#831843">Polymorphism</text><text x="960.0" y="256" font-family="Arial" font-size="17" text-anchor="middle" fill="#831843">One interface, many forms</text><text x="550.0" y="496" font-family="Arial" font-size="17" text-anchor="middle" fill="#475569">A way to organize programs around real-world entities</text></svg>